    const tone=(depth<=1?(n.c||n._branch):null);
    el.className='node'+(depth===0?' root':'')+(depth===1?' lv1':'')
      +(n.c==='src'?' leafsrc':'')+(tone?' tone-'+tone:(n.c?' tone-'+n.c:''))
      +((n.k&&!n._open)?' collapsed':'');
    if(depth>=1 && n._branch) el.style.setProperty('--bc','var(--'+(n.c==='src'?'ink3':n._branch)+')');
    if(depth>=2) el.style.borderLeft='3px solid var(--bc,var(--line))';
    const cnt=n.k?`<span class="cnt">${n._open?'−':n.k.length}</span>`:'';
    el.innerHTML=`<div class="t">${n.t}${cnt}</div>${n.n?`<div class="n">${n.n}</div>`:''}`;
    el.style.maxWidth=depth===0?'260px':depth===1?'320px':'380px';
    stage.appendChild(el);
    const it={n,el,depth,parent,kids:[]};
    items.push(it); if(parent)parent.kids.push(it);
    if(n.k&&n._open) n.k.forEach(c=>walk(c,depth+1,it));
    if(n.k) el.addEventListener('click',e=>{e.stopPropagation();n._open=!n._open;layout();});
    return it;
  })(root,0,null);
  // 2) 量測
  items.forEach(it=>{const r=it.el.getBoundingClientRect();it.w=r.width/Z;it.h=r.height/Z;});
  // 3) 各層 x 位置＝前一層最大寬度累加
  const byd={}; items.forEach(it=>(byd[it.depth]=byd[it.depth]||[]).push(it));
  const maxd=Math.max(...items.map(i=>i.depth));
  const colx=[PADX];
  for(let dd=1;dd<=maxd;dd++){
    const prevMax=Math.max(...byd[dd-1].map(i=>i.w));
    colx[dd]=colx[dd-1]+prevMax+GAPX;
  }
  // 4) y：後序排列，葉節點依序堆疊，父節點取子節點中線
  let cur=PADY;
  (function place(it){
    if(!it.kids.length){it.y=cur;cur+=it.h+VGAP;return;}
    it.kids.forEach(place);
    const a=it.kids[0], b=it.kids[it.kids.length-1];
    it.y=(a.y+(b.y+b.h))/2-it.h/2;
    if(it.y<PADY){const dy=PADY-it.y;items.forEach(x=>{if(x.y!=null)x.y+=dy});cur+=dy;}
  })(items[0]);
  // 5) 套用位置 + 畫連線
  let W=0,H=0,g='';
  items.forEach(it=>{
    it.x=colx[it.depth];
    it.el.style.left=it.x+'px'; it.el.style.top=it.y+'px';
    W=Math.max(W,it.x+it.w); H=Math.max(H,it.y+it.h);
    if(it.parent){
      const p=it.parent;
      const x1=p.x+p.w, y1=p.y+p.h/2, x2=it.x, y2=it.y+it.h/2, mx=(x1+x2)/2;
      const col='var(--'+(it.n.c==='src'?'ink3':(it.n._branch||'line'))+')';
      g+=`<path d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}" fill="none"
        stroke="${col}" stroke-width="${it.depth<=1?2:1.4}" opacity="${it.depth<=1?.85:.5}"/>`;
    }
  });
  svg.setAttribute('width',W+PADX); svg.setAttribute('height',H+PADY);
  svg.style.width=(W+PADX)+'px'; svg.style.height=(H+PADY)+'px';
  svg.innerHTML=g;
  stage.style.width=(W+PADX)+'px'; stage.style.height=(H+PADY)+'px';
}

function setAll(root,open,maxDepth){
  (function w(n,d){ if(n.k){ n._open = open && d<maxDepth; n.k.forEach(c=>w(c,d+1)); } })(root,0);
}
$('#bexp').onclick=()=>{setAll(DATA[VIEW],true,99);layout();};
$('#bcol').onclick=()=>{setAll(DATA[VIEW],true,1);layout();};
$$('#tabs .tab').forEach(b=>b.onclick=()=>{
  VIEW=b.dataset.v; $$('#tabs .tab').forEach(o=>o.setAttribute('aria-selected',o===b));
  layout(); wrap.scrollTo(0,0);
});
$('#btheme').onclick=()=>{const h=document.documentElement;
  const l=h.getAttribute('data-t')==='light';
  h.setAttribute('data-t',l?'dark':'light');
  $('#btheme').textContent=l?'◐ 淺色':'◐ 深色'; layout();};
const zoom=v=>{Z=Math.min(1.6,Math.max(.4,v));stage.style.transform=`scale(${Z})`;$('#zr').textContent=Math.round(Z*100)+'%';};
$('#zi').onclick=()=>zoom(Z+.1); $('#zo').onclick=()=>zoom(Z-.1); $('#zr').onclick=()=>zoom(1);
setAll(DATA.prob,true,2);
layout();
</script>
