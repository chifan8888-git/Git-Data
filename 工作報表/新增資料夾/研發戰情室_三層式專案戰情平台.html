<!DOCTYPE html>
<html lang="zh-Hant" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>研發戰情室 · 三層式專案戰情平台</title>
<style>
:root{
  color-scheme:dark;
  --s0:#111110; --s1:#1a1a19; --s2:#232321; --s3:#2d2d2a; --line:#383835;
  --ink:#ffffff; --ink2:#c3c2b7; --ink3:#8f8e85;
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#008300;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b;
  --grid:#2b2b28;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 8px 24px rgba(0,0,0,.35);
}
html[data-theme="light"]{
  color-scheme:light;
  --s0:#f2f1ee; --s1:#fcfcfb; --s2:#f7f6f3; --s3:#efeeea; --line:#dedcd6;
  --ink:#0b0b0b; --ink2:#52514e; --ink3:#7d7c76;
  --c1:#2a78d6; --c2:#eb6834; --c3:#1baf7a; --c4:#eda100; --c5:#e87ba4; --c6:#008300;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b;
  --grid:#e8e6e1;
  --shadow:0 1px 2px rgba(0,0,0,.06),0 8px 24px rgba(0,0,0,.08);
}
*{box-sizing:border-box}
body{margin:0;background:var(--s0);color:var(--ink);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:inherit}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:.01em}
.wrap{max-width:1560px;margin:0 auto;padding:0 22px 64px}

/* ---------- header ---------- */
header{position:sticky;top:0;z-index:60;background:color-mix(in srgb,var(--s0) 92%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hd{max-width:1560px;margin:0 auto;padding:12px 22px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px}
.brand b{font-size:17px;font-weight:700;letter-spacing:.02em}
.brand span{font-size:12px;color:var(--ink3)}
.tiers{display:flex;gap:4px;background:var(--s2);border:1px solid var(--line);border-radius:9px;padding:3px}
.tier{padding:6px 14px;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink2);
  border:none;background:none;font-family:inherit;white-space:nowrap;transition:.12s}
.tier:hover{color:var(--ink)}
.tier[aria-selected="true"]{background:var(--c1);color:#fff}
.tier small{display:block;font-size:10px;font-weight:400;opacity:.8;letter-spacing:.02em}
.spacer{flex:1}
.iconbtn{background:var(--s2);border:1px solid var(--line);color:var(--ink2);border-radius:8px;
  padding:7px 12px;cursor:pointer;font-family:inherit;font-size:12.5px}
.iconbtn:hover{color:var(--ink);border-color:var(--ink3)}
.crumb{max-width:1560px;margin:0 auto;padding:0 22px 10px;display:flex;align-items:center;gap:7px;
  font-size:12.5px;color:var(--ink3);flex-wrap:wrap}
.crumb b{color:var(--ink2);font-weight:500}
.crumb .cx{cursor:pointer;color:var(--c1);font-weight:600}
.crumb .cx:hover{text-decoration:underline}
.subtabs{max-width:1560px;margin:0 auto;padding:0 22px 0;display:flex;gap:2px;border-bottom:1px solid var(--line);
  margin-bottom:-1px;overflow-x:auto}
.subtabs button{background:none;border:none;border-bottom:2px solid transparent;color:var(--ink3);font-family:inherit;
  font-size:13px;font-weight:600;padding:9px 14px;cursor:pointer;white-space:nowrap;transition:.12s}
.subtabs button:hover{color:var(--ink2)}
.subtabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--c1)}

/* ---------- layout ---------- */
.sec{margin-top:26px}
.sec-h{display:flex;align-items:baseline;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.sec-h h2{font-size:15.5px}
.sec-h .sub{font-size:12px;color:var(--ink3)}
.grid{display:grid;gap:14px}
.card{background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.card.pad0{padding:0;overflow:hidden}
.card h3{font-size:13.5px;margin-bottom:2px}
.card .note{font-size:11.5px;color:var(--ink3);margin-bottom:12px}

/* ---------- stat tiles ---------- */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:12px}
.tile{background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.tile .lb{font-size:11.5px;color:var(--ink3);margin-bottom:6px;letter-spacing:.02em}
.tile .vl{font-size:29px;font-weight:650;line-height:1.05;letter-spacing:-.02em}
.tile .vl small{font-size:14px;font-weight:500;color:var(--ink2);margin-left:3px}
.tile .dl{font-size:11.5px;color:var(--ink3);margin-top:5px}
.tile.hero .vl{font-size:44px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.st-good{color:var(--good)} .st-warn{color:var(--warn)} .st-serious{color:var(--serious)} .st-crit{color:var(--crit)}
.bg-good{background:var(--good)} .bg-warn{background:var(--warn)} .bg-serious{background:var(--serious)} .bg-crit{background:var(--crit)}

/* ---------- table ---------- */
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-weight:600;color:var(--ink3);font-size:11.5px;letter-spacing:.03em;
  padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;background:var(--s1);z-index:2}
td{padding:9px 10px;border-bottom:1px solid var(--grid);vertical-align:middle}
tbody tr:hover{background:var(--s2)}
tr.clk{cursor:pointer}
.num{text-align:right;font-variant-numeric:tabular-nums}
.tw{max-height:520px;overflow:auto}
.mono{font-variant-numeric:tabular-nums}
.trunc{max-width:230px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}

/* ---------- chips / badges ---------- */
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;font-size:11px;
  font-weight:600;border:1px solid var(--line);background:var(--s2);color:var(--ink2);white-space:nowrap}
.chip.crit{border-color:color-mix(in srgb,var(--crit) 45%,transparent);color:var(--crit)}
.chip.serious{border-color:color-mix(in srgb,var(--serious) 45%,transparent);color:var(--serious)}
.chip.warn{border-color:color-mix(in srgb,var(--warn) 45%,transparent);color:var(--warn)}
.chip.good{border-color:color-mix(in srgb,var(--good) 45%,transparent);color:var(--good)}
.gr{display:inline-flex;width:21px;height:21px;border-radius:6px;align-items:center;justify-content:center;
  font-size:11.5px;font-weight:700;color:#fff}
.gr.A{background:var(--good)} .gr.B{background:var(--c1)} .gr.C{background:var(--warn);color:#241a00}
.gr.D{background:var(--crit)} .gr.x{background:var(--s3);color:var(--ink3)}

/* ---------- bars ---------- */
.pbar{position:relative;height:7px;border-radius:4px;background:var(--s3);overflow:hidden;min-width:64px}
.pbar i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;display:block}
.pbar u{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink3);opacity:.85}
.bcell{display:flex;align-items:center;gap:9px}
.bcell .pbar{flex:1}
.bcell span{font-variant-numeric:tabular-nums;font-size:11.5px;color:var(--ink2);min-width:38px;text-align:right}

/* ---------- risk matrix ---------- */
.rm{display:grid;grid-template-columns:52px repeat(5,1fr);gap:2px}
.rm .lbl{font-size:10.5px;color:var(--ink3);display:flex;align-items:center;justify-content:center;text-align:center}
.rm .cellw{aspect-ratio:1.55;border-radius:6px;padding:5px;display:flex;flex-wrap:wrap;gap:3px;
  align-content:flex-start;position:relative;overflow:hidden}
.rm .cnt{position:absolute;right:5px;bottom:3px;font-size:10px;color:rgba(255,255,255,.75);font-weight:600}
.rm .pd{width:19px;height:19px;border-radius:5px;background:rgba(0,0,0,.42);color:#fff;font-size:9px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;font-weight:700;border:1px solid rgba(255,255,255,.22)}
.rm .pd:hover{background:#fff;color:#000}
.rmleg{display:flex;gap:14px;font-size:11.5px;color:var(--ink3);margin-top:10px;flex-wrap:wrap;align-items:center}

/* ---------- drill cards ---------- */
.dcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(272px,1fr));gap:12px}
.dcard{background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:15px 17px;cursor:pointer;transition:.14s}
.dcard:hover{border-color:var(--c1);transform:translateY(-1px);box-shadow:var(--shadow)}
.dcard .t{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:3px}
.dcard .t b{font-size:14.5px}
.dcard .h{font-size:11.5px;color:var(--ink3);margin-bottom:11px}
.dcard .kv{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;margin-bottom:11px}
.dcard .kv div{font-size:11px;color:var(--ink3)}
.dcard .kv div b{display:block;font-size:17px;color:var(--ink);font-weight:650;font-variant-numeric:tabular-nums}
.dcard .go{font-size:11.5px;color:var(--c1);font-weight:600}

/* ---------- drawer ---------- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:90;opacity:0;pointer-events:none;transition:.18s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(880px,96vw);background:var(--s0);z-index:100;
  border-left:1px solid var(--line);transform:translateX(102%);transition:transform .22s cubic-bezier(.3,0,.2,1);
  overflow-y:auto;box-shadow:-8px 0 40px rgba(0,0,0,.4)}
.drawer.on{transform:none}
.dhd{position:sticky;top:0;background:var(--s0);border-bottom:1px solid var(--line);padding:16px 22px;z-index:5}
.dhd .x{position:absolute;top:14px;right:18px}
.dbody{padding:18px 22px 60px}

/* ---------- misc ---------- */
.sel{background:var(--s2);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:7px 11px;
  font-family:inherit;font-size:13px;cursor:pointer}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--ink2);margin-top:9px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
svg text{font-family:inherit}
.tip{position:fixed;z-index:200;background:var(--s1);border:1px solid var(--line);border-radius:8px;
  padding:8px 11px;font-size:12px;pointer-events:none;box-shadow:var(--shadow);opacity:0;transition:opacity .1s;max-width:300px}
.tip.on{opacity:1}
.tip b{display:block;margin-bottom:3px}
.tip .r{display:flex;justify-content:space-between;gap:14px;color:var(--ink2)}
.empty{padding:34px;text-align:center;color:var(--ink3);font-size:12.5px}
.kvlist{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.kvlist div{background:var(--s2);border:1px solid var(--line);border-radius:9px;padding:10px 12px}
.kvlist div .k{font-size:11px;color:var(--ink3)}
.kvlist div .v{font-size:17px;font-weight:650;font-variant-numeric:tabular-nums;margin-top:2px;line-height:1.25}
.hbar{display:flex;align-items:center;gap:9px;margin-bottom:7px}
.hbar .n{width:88px;font-size:12px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbar .tr{flex:1;height:9px;background:var(--s3);border-radius:5px;overflow:hidden;position:relative}
.hbar .tr i{position:absolute;left:0;top:0;bottom:0;border-radius:5px}
.hbar .v{width:44px;text-align:right;font-size:11.5px;font-variant-numeric:tabular-nums;color:var(--ink2)}
.purpose{margin-top:22px;background:var(--s1);border:1px solid var(--line);border-left:3px solid var(--c1);
  border-radius:9px;padding:11px 16px;display:flex;gap:14px;align-items:baseline;flex-wrap:wrap}
.purpose b{font-size:13.5px;white-space:nowrap}
.dimh{border-bottom:1px solid var(--line);padding-bottom:9px;align-items:center}
.dimn{display:inline-flex;width:26px;height:26px;border-radius:8px;background:var(--c1);color:#fff;
  align-items:center;justify-content:center;font-size:14px;font-weight:700;flex:0 0 auto}
.dimh h2{font-size:17px}
.fbtn{background:var(--s2);border:1px solid var(--line);color:var(--ink2);border-radius:999px;
  padding:4px 12px;font-size:11.5px;font-family:inherit;cursor:pointer;font-weight:600}
.fbtn:hover{color:var(--ink)}
.fbtn[aria-selected="true"]{background:var(--c1);border-color:var(--c1);color:#fff}
.purpose span{font-size:12.5px;color:var(--ink2);line-height:1.6}
.deccard{border-left:3px solid var(--line)}
.deccard.close{border-left-color:var(--warn)}
.deccard.stop{border-left-color:var(--crit)}
.deccard.rescue{border-left-color:var(--serious)}
.kv2{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;margin-top:10px}
.kv2 div span{font-size:11px;color:var(--ink3);display:block}
.kv2 div b{font-size:15px;font-weight:650;font-variant-numeric:tabular-nums}
table.mini{font-size:11.5px}
table.mini td{padding:5px 6px;border-bottom:1px solid var(--grid)}
table.mini tr:hover{background:var(--s2)}
.gradeoff .gcol{display:none}
.foot{margin-top:40px;padding-top:16px;border-top:1px solid var(--line);font-size:11.5px;color:var(--ink3);line-height:1.7}
.foot b{color:var(--ink2)}
details summary::marker{color:var(--ink3)}
details[open] summary{margin-bottom:4px}
@media(max-width:820px){ .hd{gap:10px} .tier{padding:6px 9px;font-size:12px} .wrap{padding:0 12px 48px} }
@media print{ header{position:static} .drawer{position:static;transform:none;width:100%} }
</style>
</head>
<body>
<header>
  <div class="hd">

<script>
/* ============================ helpers ============================ */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const P=DATA.projects, PE=DATA.persons, DV=DATA.divisions, CO=DATA.company;
const SER=['--c1','--c2','--c3','--c4','--c5','--c6'];
const cv=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=(n,d=0)=>n==null||isNaN(n)?'—':Number(n).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const money=n=>{n=Number(n)||0; if(Math.abs(n)>=1e8)return (n/1e8).toFixed(2)+'億'; if(Math.abs(n)>=1e4)return (n/1e4).toFixed(0)+'萬'; return fmt(n);};
const pct=n=>n==null?'—':fmt(n,1)+'%';
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

const riskColor=s=>s>=20?'var(--crit)':s>=12?'var(--serious)':s>=6?'var(--warn)':'var(--good)';
const riskClass=s=>s>=20?'crit':s>=12?'serious':s>=6?'warn':'good';
const spiColor=v=>v>=0.95?'var(--good)':v>=0.8?'var(--warn)':v>=0.6?'var(--serious)':'var(--crit)';
const loadColor=v=>v>110?'var(--crit)':v>=85?'var(--good)':v>=60?'var(--warn)':'var(--serious)';
const gradeCls=g=>['A','B','C','D'].includes(g)?g:'x';

/* tooltip */
const TIP=$('#tip');
function tipOn(e,html){TIP.innerHTML=html;TIP.classList.add('on');tipMove(e);}
function tipMove(e){const r=TIP.getBoundingClientRect();let x=e.clientX+14,y=e.clientY+14;
  if(x+r.width>innerWidth-8)x=e.clientX-r.width-14; if(y+r.height>innerHeight-8)y=e.clientY-r.height-14;
  TIP.style.left=x+'px';TIP.style.top=y+'px';}
function tipOff(){TIP.classList.remove('on');}
document.addEventListener('mousemove',e=>{if(TIP.classList.contains('on'))tipMove(e)});

/* ============================ state ============================ */
let ST={lv:1,div:null,dept:null};
const projList=ids=>ids.map(i=>P[i]).filter(Boolean);
const ACT=p=>p.status==='Active';

function setState(o){Object.assign(ST,o);render();}
function go(lv,dv,dp){
  if(lv>=2&&!dv)dv=DATA.div_order[0];
  if(lv>=3&&(!dp||!DV[dv].depts[dp]))dp=Object.keys(DV[dv].depts)[0];
  setState({lv,div:dv,dept:dp});
}

/* ============================ charts ============================ */
function barChart(el,rows,{val,label,color,max,fmtv=fmtNum=>fmt(fmtNum,0),unit='',lw=118}){
  // horizontal bars, thin marks, direct labels at tip
  const mx=max||Math.max(...rows.map(val),1);
  el.innerHTML=rows.map((r,i)=>{
    const v=val(r), w=clamp(v/mx*100,0,100), c=typeof color==='function'?color(r,i):color;
    return `<div class="hbar" data-i="${i}"><div class="n" style="width:${lw}px" title="${esc(label(r))}">${esc(label(r))}</div>
      <div class="tr"><i style="width:${w}%;background:${c}"></i></div>
      <div class="v">${fmtv(v)}${unit}</div></div>`;
  }).join('');
}

/* 水平堆疊條：工時歸屬組成（2px 表面間隙分隔） */
function stackBar(el,segs,{h=26,showPct=true}={}){
  const tot=segs.reduce((s,x)=>s+x.h,0)||1;
  el.innerHTML=`<div style="display:flex;height:${h}px;border-radius:6px;overflow:hidden;gap:2px;background:var(--s1)">
    ${segs.map(s=>{const w=s.h/tot*100;
      return `<div class="sg" data-k="${esc(s.label)}" style="width:${w}%;background:${s.c};display:flex;align-items:center;
        justify-content:center;cursor:default;min-width:2px" title="${esc(s.label)} ${fmt(s.h)} hr（${fmt(w,1)}%）">
        ${w>=9&&showPct?`<span style="font-size:10.5px;font-weight:700;color:${s.dark?'#fff':'#1a1a19'}">${fmt(w,0)}%</span>`:''}</div>`}).join('')}
  </div>
  <div class="legend" style="margin-top:9px">${segs.map(s=>`<span><i style="background:${s.c}"></i>${esc(s.label)} <b style="color:var(--ink)">${fmt(s.h)}</b> hr</span>`).join('')}</div>`;
}

/* 堆疊柱：月度 專案 / 非專案 / 休假 */
function stackCols(el,cats,series,{h=200}={}){
  const W=760,H=h,PAD={l:46,r:10,t:12,b:26};
  const iw=W-PAD.l-PAD.r, ih=H-PAD.t-PAD.b;
  const tots=cats.map((_,i)=>series.reduce((s,x)=>s+x.v[i],0));
  const mx=Math.max(...tots,1), step=Math.ceil(mx/4/500)*500||1, top=step*4;
  const bw=Math.min(24,iw/cats.length*0.62);
  let g='';
  for(let t=0;t<=4;t++){const y=PAD.t+ih-t/4*ih;
    g+=`<line x1="${PAD.l}" y1="${y}" x2="${W-PAD.r}" y2="${y}" stroke="var(--grid)"/>
        <text x="${PAD.l-7}" y="${y+4}" text-anchor="end" font-size="10" fill="var(--ink3)">${fmt(step*t)}</text>`}
  cats.forEach((c,i)=>{
    const cx=PAD.l+(i+0.5)/cats.length*iw; let acc=0;
    series.forEach(s=>{
      const hh=s.v[i]/top*ih; if(hh<=0)return;
      const y=PAD.t+ih-acc-hh;
      g+=`<rect x="${cx-bw/2}" y="${y+1}" width="${bw}" height="${Math.max(0,hh-2)}" fill="${s.c}" rx="2"/>`;
      acc+=hh;
    });
    if(!(cats.length>10&&i%2))g+=`<text x="${cx}" y="${H-8}" text-anchor="middle" font-size="10" fill="var(--ink3)">${esc(c.slice(2))}</text>`;
    g+=`<rect x="${cx-iw/cats.length/2}" y="${PAD.t}" width="${iw/cats.length}" height="${ih}" fill="transparent" class="hc" data-i="${i}"/>`;
  });
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">${g}</svg>`;
  el.querySelectorAll('.hc').forEach(r=>{
    r.addEventListener('mouseenter',e=>{const i=+r.dataset.i;
      tipOn(e,`<b>${cats[i]}　合計 ${fmt(tots[i])} hr</b>`+series.map(s=>`<div class="r"><span><i style="display:inline-block;width:9px;height:9px;border-radius:2px;background:${s.c};margin-right:5px"></i>${esc(s.n)}</span><b style="color:var(--ink)">${fmt(s.v[i])} hr</b></div>`).join(''))});
    r.addEventListener('mouseleave',tipOff);
  });
}

/* 工時歸屬區塊（任一層級共用） */
const BKC={proj:'--c1',support:'--c2',rdmisc:'--c3',meet:'--c4',cross:'--c5',trip:'--c6',other:'--c2'};
const KIND2BK={'一般專案':'proj','輔助生產(設備,檢工治模具)':'support','客訴':'support','矯正及預防報告':'support',
  '改善型設變':'rdmisc','研發送樣/展覽樣品':'rdmisc','工況':'rdmisc','認證':'rdmisc','產學合作':'rdmisc',
  '會議':'meet','部門會議':'meet','非生產性質的跨部門協助':'cross','出差':'trip','其他':'other','休假':'leave'};
const kindColor=k=>{const b=KIND2BK[k]||'other';return (b==='other'||b==='leave')?cv('--ink3'):cv(BKC[b]);};
const BKDARK={proj:1,support:1,rdmisc:1,meet:0,cross:0,trip:1,other:1};
function hoursSegs(hrs){
  return hrs.buckets.map(b=>({label:b.label,h:b.h,c:b.k==='other'?'var(--ink3)':cv(BKC[b.k]||'--c1'),dark:b.k==='other'?1:BKDARK[b.k]}));
}
function hoursBlock(hrs,people,title){
  const out=hrs.h_out,inn=hrs.h_in;
  return `
  <div class="grid" style="grid-template-columns:1fr 1fr">
    <div class="card"><h3>專案 vs 非專案 工時歸屬${title?`　<span style="font-weight:400;color:var(--ink3);font-size:12px">${esc(title)}</span>`:''}</h3>
      <div class="note">依 PLM002「工時類別」歸屬。實證顯示<b>僅「一般專案」100% 掛有專案編號</b>，故以其為專案直接工時；其餘均無編號，歸為非專案。已排除休假 ${fmt(hrs.leave)} hr。</div>
      <div class="tiles" style="grid-template-columns:repeat(3,1fr);margin-bottom:14px">
        ${tile('專案直接工時',fmt(hrs.h_proj),'hr',`佔淨工時 ${pct(hrs.proj_rate)}`)}
        ${tile('非專案工時',fmt(hrs.h_non),'hr',`佔淨工時 ${pct(100-hrs.proj_rate)}`,hrs.proj_rate<55?'st-crit':hrs.proj_rate<70?'st-warn':'st-good')}
        ${tile('淨投入工時',fmt(hrs.net),'hr','不含休假')}
      </div>
      <div id="${title?'hb2':'hb1'}"></div>
    </div>
    <div class="card"><h3>專案工時是否落在戰情追蹤範圍內</h3>
      <div class="note">戰情表僅收錄 44 件專案。掛號工時若指向表外編號，代表該投入<b>不在任何主管的追蹤視野中</b>。</div>
      <div class="tiles" style="grid-template-columns:repeat(2,1fr);margin-bottom:14px">
        ${tile('追蹤範圍內',fmt(inn),'hr',`佔專案工時 ${pct(hrs.in_rate)}`,hrs.in_rate>=70?'st-good':'st-warn')}
        ${tile('範圍外',fmt(out),'hr',`佔專案工時 ${pct(100-hrs.in_rate)}`,hrs.in_rate<60?'st-crit':'st-warn')}
      </div>
      <div class="pbar" style="height:14px"><i style="width:${hrs.in_rate}%;background:var(--c1)"></i></div>
      <div class="legend"><span><i style="background:var(--c1)"></i>追蹤範圍內</span><span><i style="background:var(--s3)"></i>範圍外</span></div>
      <div id="${title?'os2':'os1'}" style="margin-top:14px"></div>
    </div>
  </div>`;
}
function quadChart(el,people,onClick,{anon=false,h=330}={}){
  const W=760,H=h,PAD={l:46,r:110,t:14,b:34};
  const iw=W-PAD.l-PAD.r, ih=H-PAD.t-PAD.b;
  const X=v=>PAD.l+clamp(v,0,130)/130*iw, Y=v=>PAD.t+ih-clamp(v,0,100)/100*ih;
  const LX=X(85), MY=Y(50);
  let g=`<rect x="${PAD.l}" y="${PAD.t}" width="${LX-PAD.l}" height="${MY-PAD.t}" fill="var(--c1)" opacity=".05"/>
         <rect x="${LX}" y="${PAD.t}" width="${PAD.l+iw-LX}" height="${MY-PAD.t}" fill="var(--good)" opacity=".06"/>
         <rect x="${PAD.l}" y="${MY}" width="${LX-PAD.l}" height="${PAD.t+ih-MY}" fill="var(--serious)" opacity=".06"/>
         <rect x="${LX}" y="${MY}" width="${PAD.l+iw-LX}" height="${PAD.t+ih-MY}" fill="var(--crit)" opacity=".07"/>`;
  [0,25,50,75,100].forEach(t=>{g+=`<line x1="${PAD.l}" y1="${Y(t)}" x2="${PAD.l+iw}" y2="${Y(t)}" stroke="var(--grid)"/>
    <text x="${PAD.l-7}" y="${Y(t)+4}" text-anchor="end" font-size="10" fill="var(--ink3)">${t}</text>`});
  [0,30,60,90,120].forEach(t=>{g+=`<text x="${X(t)}" y="${H-16}" text-anchor="middle" font-size="10" fill="var(--ink3)">${t}%</text>`});
  g+=`<line x1="${LX}" y1="${PAD.t}" x2="${LX}" y2="${PAD.t+ih}" stroke="var(--ink3)" stroke-width="1" opacity=".6"/>
      <line x1="${PAD.l}" y1="${MY}" x2="${PAD.l+iw}" y2="${MY}" stroke="var(--ink3)" stroke-width="1" opacity=".6"/>`;
  g+=`<text x="${PAD.l+8}" y="${PAD.t+14}" font-size="10.5" fill="var(--ink3)">量能未滿 · 可加載</text>
      <text x="${LX+8}" y="${PAD.t+14}" font-size="10.5" fill="var(--ink3)">高效主力 · 留才重點</text>
      <text x="${PAD.l+8}" y="${PAD.t+ih-8}" font-size="10.5" fill="var(--ink3)">投入與產出俱低 · 需輔導</text>
      <text x="${LX+8}" y="${PAD.t+ih-8}" font-size="10.5" fill="var(--ink3)">過勞低效 · 需卸載/協助</text>
      <text x="${PAD.l+iw/2}" y="${H-2}" text-anchor="middle" font-size="10.5" fill="var(--ink3)">近半年負荷率 →</text>`;
  people.forEach(p=>{

  });
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">${g}</svg>`;
  el.querySelectorAll('.qd').forEach(d=>{
    const p=PE[d.dataset.n];
    if(anon){
      d.style.cursor='default';

        <div class="r"><span>在製專案</span><b style="color:var(--ink)">${p.n_proj_active}</b></div>
        <div class="r" style="color:var(--ink3);margin-top:4px">個人明細請由第二層下鑽</div>`));
      d.addEventListener('mouseleave',tipOff);
      return;
    }
    d.addEventListener('mouseenter',e=>tipOn(e,`<b>${esc(p.name)}　${esc(p.title||'')}</b>
      <div class="r"><span>單位</span><b style="color:var(--ink)">${esc(p.dept)}</b></div>
      <div class="r"><span>負荷率</span><b style="color:var(--ink)">${fmt(p.load,0)}%</b></div>

      <div class="r"><span>在製專案</span><b style="color:var(--ink)">${p.n_proj_active}</b></div>
      <div class="r"><span>逾期未結</span><b style="color:var(--ink)">${p.n_task_overdue}</b></div>`));
    d.addEventListener('mouseleave',tipOff);
    if(onClick) d.addEventListener('click',()=>{tipOff();onClick(p.name)});
  });
}

function lineChart(el,series,cats,{h=190,yfmt=v=>fmt(v,0),title=''}){
  const W=760,H=h,PAD={l:46,r:12,t:10,b:26};
  const iw=W-PAD.l-PAD.r, ih=H-PAD.t-PAD.b;
  const all=series.flatMap(s=>s.v);
  const mx=Math.max(...all,1), ticks=4;
  const step=Math.ceil(mx/ticks/100)*100||1, top=step*ticks;
  const X=i=>PAD.l+(cats.length<2?iw/2:i/(cats.length-1)*iw);
  const Y=v=>PAD.t+ih-v/top*ih;
  let g='';
  for(let t=0;t<=ticks;t++){const y=PAD.t+ih-t/ticks*ih;
    g+=`<line x1="${PAD.l}" y1="${y}" x2="${W-PAD.r}" y2="${y}" stroke="var(--grid)" stroke-width="1"/>
        <text x="${PAD.l-7}" y="${y+4}" text-anchor="end" font-size="10" fill="var(--ink3)">${yfmt(step*t)}</text>`;}
  cats.forEach((c,i)=>{ if(cats.length>10&&i%2)return;
    g+=`<text x="${X(i)}" y="${H-8}" text-anchor="middle" font-size="10" fill="var(--ink3)">${esc(c.slice(2))}</text>`;});
  series.forEach((s,si)=>{
    const d=s.v.map((v,i)=>`${i?'L':'M'}${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' ');
    g+=`<path d="${d}" fill="none" stroke="${s.c}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    const li=s.v.length-1;
    g+=`<circle cx="${X(li)}" cy="${Y(s.v[li])}" r="4.5" fill="${s.c}" stroke="var(--s1)" stroke-width="2"/>`;
  });
  // hover crosshair
  g+=`<g id="chx" style="display:none"><line y1="${PAD.t}" y2="${PAD.t+ih}" stroke="var(--ink3)" stroke-width="1"/></g>`;
  cats.forEach((c,i)=>{ g+=`<rect x="${X(i)-iw/(cats.length*2)}" y="${PAD.t}" width="${iw/cats.length}" height="${ih}" fill="transparent" class="hz" data-i="${i}"/>`; });
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">${g}</svg>`;
  el.querySelectorAll('.hz').forEach(r=>{
    r.addEventListener('mouseenter',e=>{const i=+r.dataset.i;
      const cx=el.querySelector('#chx'); cx.style.display=''; cx.firstElementChild.setAttribute('x1',X(i)); cx.firstElementChild.setAttribute('x2',X(i));
      tipOn(e,`<b>${cats[i]}</b>`+series.map(s=>`<div class="r"><span><i style="display:inline-block;width:9px;height:9px;border-radius:2px;background:${s.c};margin-right:5px"></i>${esc(s.n)}</span><b style="color:var(--ink)">${yfmt(s.v[i])}</b></div>`).join(''));});
    r.addEventListener('mouseleave',()=>{tipOff();el.querySelector('#chx').style.display='none';});
  });
}

function riskMatrix(el,projs,onClick){
  const cell=(p,i)=>{const s=p*i; return s>=20?'var(--crit)':s>=12?'var(--serious)':s>=6?'var(--warn)':'var(--good)';};
  let h='';
  for(let P_=5;P_>=1;P_--){
    h+=`<div class="lbl">${['','極低','低','中','高','極高'][P_]}</div>`;
    for(let I=1;I<=5;I++){
      const list=projs.filter(x=>x.riskP===P_&&x.riskI===I);
      h+=`<div class="cellw" style="background:color-mix(in srgb,${cell(P_,I)} ${list.length?36:13}%,var(--s1))">`+
        list.slice(0,12).map(x=>`<div class="pd" data-id="${x.id}" title="${esc(x.id+' '+x.name)}">${esc(x.id.slice(0,2))}</div>`).join('')+
        (list.length?`<span class="cnt">${list.length}</span>`:'')+`</div>`;
    }
  }
  h+=`<div class="lbl"></div>`+[1,2,3,4,5].map(i=>`<div class="lbl">${['','極低','低','中','高','極高'][i]}</div>`).join('');
  el.innerHTML=h;
  el.querySelectorAll('.pd').forEach(d=>d.addEventListener('click',()=>onClick(d.dataset.id)));
}

function peopleRows(names,{showDept=true}={}){

<script>
/* ==================== PLM014 圖形元件 ==================== */
const B14=()=>DATA.plm014;
const DAY=864e5;
const pd=s=>s?new Date(s+'T00:00:00'):null;
const dstr=d=>d.toISOString().slice(0,10);
const growthColor=g=>g==null?'var(--ink3)':g<=1.1?'var(--good)':g<=1.5?'var(--warn)':g<=2.5?'var(--serious)':'var(--crit)';
const growthBand=g=>g==null?'—':g<=1.1?'如期 ≤1.1x':g<=1.5?'輕度膨脹 1.1–1.5x':g<=2.5?'嚴重膨脹 1.5–2.5x':'失控 >2.5x';

/* ---------- 甘特圖 ---------- */
function ganttChart(el,rows,onClick,{groupBy='div',h0=20}={}){
  if(!rows.length){el.innerHTML='<div class="empty">無專案</div>';return;}
  const T0=pd('2024-01-01'), T1=pd('2027-02-01');
  const W=1160, L=232, R=14, TOP=30;
  const groups=[];
  if(groupBy){const m={};rows.forEach(r=>{(m[r[groupBy]]=m[r[groupBy]]||[]).push(r)});
    Object.entries(m).forEach(([k,v])=>groups.push([k,v]));}
  else groups.push([null,rows]);
  const nrow=rows.length, nhdr=groupBy?groups.length:0;
  const H=TOP+ (nrow*h0) + nhdr*22 + 8;
  const X=d=>L+(d-T0)/(T1-T0)*(W-L-R);
  const today=pd(DATA.meta.today);
  let g=`<defs><pattern id="hatchOver" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
    <rect width="6" height="6" fill="var(--crit)"/><line x1="0" y1="0" x2="0" y2="6" stroke="#fff" stroke-opacity=".55" stroke-width="2.6"/></pattern></defs>`;
  // 年月網格
  for(let y=2024;y<=2027;y++){
    for(let q=0;q<4;q++){
      const d=new Date(Date.UTC(y,q*3,1)); if(d<T0||d>T1)continue;
      const x=X(d);
      g+=`<line x1="${x}" y1="${TOP-8}" x2="${x}" y2="${H-6}" stroke="var(--grid)" stroke-width="1"/>`;
      g+=`<text x="${x}" y="${TOP-13}" font-size="9.5" fill="var(--ink3)" text-anchor="middle">${q?'Q'+(q+1):y}</text>`;
    }
  }
  g+=`<line x1="${X(today)}" y1="${TOP-8}" x2="${X(today)}" y2="${H-6}" stroke="var(--c2)" stroke-width="1.5" stroke-dasharray="3 3"/>
      <text x="${X(today)}" y="${TOP-13}" font-size="9.5" fill="var(--c2)" text-anchor="middle" font-weight="700">今日</text>`;
  let y=TOP+4;
  groups.forEach(([gname,list])=>{
    if(gname!=null){
      g+=`<text x="6" y="${y+13}" font-size="11" font-weight="700" fill="var(--ink2)">${esc(gname)}　<tspan fill="var(--ink3)" font-weight="400">${list.length} 件</tspan></text>`;
      g+=`<line x1="6" y1="${y+18}" x2="${W-R}" y2="${y+18}" stroke="var(--line)"/>`;
      y+=22;
    }
    list.forEach(r=>{
      const ps=pd(r.ps),pe=pd(r.pe),as_=pd(r['as']),ref=pd(r.ref),cd=pd(r.cd);
      const cy=y+h0/2;
      // 計畫條（底軌）
      if(ps&&pe){const x1=Math.max(X(ps),L),x2=X(pe);
        g+=`<rect x="${x1}" y="${cy-6}" width="${Math.max(2,x2-x1)}" height="12" rx="3" fill="var(--s3)"/>`;
        g+=`<line x1="${x2}" y1="${cy-8}" x2="${x2}" y2="${cy+8}" stroke="var(--ink3)" stroke-width="1.5"/>`;}
      // 實際條
      const ae=cd||ref;
      if(as_&&ae){const x1=Math.max(X(as_),L),x2=X(ae),c=spiColor(r.spi==null?0.5:r.spi);
        const over=pe&&ae>pe;
        g+=`<rect x="${x1}" y="${cy-3.5}" width="${Math.max(2,x2-x1)}" height="7" rx="3" fill="${c}"/>`;
        if(over){const xo=Math.max(X(pe),L);
          g+=`<rect x="${xo}" y="${cy-4.5}" width="${Math.max(1,x2-xo)}" height="9" rx="3" fill="url(#hatchOver)"/>`;}
        if(X(as_)<L) g+=`<text x="${L-3}" y="${cy+3.5}" font-size="9" fill="var(--ink3)" text-anchor="end">«</text>`;
      }
      if(cd) g+=`<path d="M${X(cd)},${cy-7} L${X(cd)+5},${cy} L${X(cd)},${cy+7} L${X(cd)-5},${cy} Z" fill="var(--good)" stroke="var(--s1)" stroke-width="1"/>`;
      // 列標籤
      g+=`<text x="6" y="${cy+3.5}" font-size="10.5" fill="var(--ink2)">${esc(r.id)}</text>`;
      g+=`<text x="82" y="${cy+3.5}" font-size="10.5" fill="var(--ink3)">${esc(r.name.slice(0,11))}</text>`;
      g+=`<rect class="gr" data-id="${r.id}" x="0" y="${y}" width="${W}" height="${h0}" fill="transparent" style="cursor:pointer"/>`;
      y+=h0;
    });
  });
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block;min-height:${Math.min(H,240)}px">${g}</svg>`;
  el.querySelectorAll('.gr').forEach(n=>{
    const r=rows.find(x=>x.id===n.dataset.id);
    n.addEventListener('mouseenter',e=>tipOn(e,`<b>${esc(r.id)} ${esc(r.name)}</b>
      <div class="r"><span>單位 / 負責人</span><b style="color:var(--ink)">${esc(r.dept)} · ${esc(r.owner)}</b></div>
      <div class="r"><span>計畫</span><b style="color:var(--ink)">${esc(r.ps||'—')} → ${esc(r.pe||'—')}</b></div>
      <div class="r"><span>實際</span><b style="color:var(--ink)">${esc(r['as']||'—')} → ${esc(r.cd||r.te||'進行中')}</b></div>
      <div class="r"><span>進度 / SPI</span><b style="color:var(--ink)">${fmt(r.prog,0)}% / ${r.spi==null?'—':fmt(r.spi,2)}</b></div>
      ${r.delay?`<div class="r"><span>逾預計完成</span><b style="color:var(--crit)">${fmt(r.delay)} 天</b></div>`:''}
      ${r.growth?`<div class="r"><span>工期膨脹</span><b style="color:${growthColor(r.growth)}">${fmt(r.growth,2)}x</b></div>`:''}`));
    n.addEventListener('mouseleave',tipOff);
    n.addEventListener('click',()=>{tipOff();onClick(r.id)});
  });
}
function ganttLegend(){return `<div class="legend" style="margin-top:10px">
  <span><i style="background:var(--s3)"></i>計畫期間（右端豎線＝預計完成日）</span>
  <span><i style="background:var(--good)"></i>實際期間（顏色＝SPI）</span>
  <span><i style="background:repeating-linear-gradient(45deg,var(--crit) 0 3px,#fff8 3px 5px)"></i>超出預計完成日之部分</span>
  <span><i style="background:var(--good);border-radius:2px;transform:rotate(45deg)"></i>專案結案日</span>
  <span><i style="background:var(--c2)"></i>今日</span>
  <span style="color:var(--ink3)">« ＝實際開工早於 2024-01</span></div>`;}

/* ---------- 工期膨脹散佈圖：預計 vs 實際（工作日） ---------- */
function growthScatter(el,pts,onClick){
  if(!pts.length){el.innerHTML='<div class="empty">尚無已結案專案可比較</div>';return;}
  const W=760,H=390,P={l:52,r:16,t:14,b:40};
  const mx=Math.max(...pts.map(p=>Math.max(p.plan,p.act)),100);
  const top=Math.ceil(mx/100)*100;
  const iw=W-P.l-P.r, ih=H-P.t-P.b;
  const X=v=>P.l+v/top*iw, Y=v=>P.t+ih-v/top*ih;
  let g='';
  for(let t=0;t<=5;t++){const v=top*t/5;
    g+=`<line x1="${P.l}" y1="${Y(v)}" x2="${P.l+iw}" y2="${Y(v)}" stroke="var(--grid)"/>
        <text x="${P.l-8}" y="${Y(v)+4}" font-size="10" fill="var(--ink3)" text-anchor="end">${fmt(v)}</text>
        <text x="${X(v)}" y="${H-22}" font-size="10" fill="var(--ink3)" text-anchor="middle">${fmt(v)}</text>`;}
  // 1:1 對角線 + 1.5x / 2x 參考線
  g+=`<line x1="${X(0)}" y1="${Y(0)}" x2="${X(top)}" y2="${Y(top)}" stroke="var(--ink3)" stroke-width="1.5"/>
      <text x="${X(top)-6}" y="${Y(top)+14}" font-size="9.5" fill="var(--ink3)" text-anchor="end">1:1 如期</text>`;
  [[1.5,'1.5x'],[2,'2x']].forEach(([k,lb])=>{
    const xEnd=top/k;
    g+=`<line x1="${X(0)}" y1="${Y(0)}" x2="${X(xEnd)}" y2="${Y(top)}" stroke="var(--grid)" stroke-dasharray="4 3"/>
        <text x="${X(xEnd)+4}" y="${Y(top)+10}" font-size="9" fill="var(--ink3)">${lb}</text>`;});
  pts.forEach(p=>{
    g+=`<circle class="gp" data-id="${p.id}" cx="${X(p.plan)}" cy="${Y(p.act)}" r="6.5"
      fill="${growthColor(p.g)}" stroke="var(--s1)" stroke-width="2" style="cursor:pointer"/>`;});
  // 只標註最極端 3 點，避免標籤淹沒
  [...pts].sort((a,b)=>b.g-a.g).slice(0,3).forEach(p=>{
    g+=`<text x="${X(p.plan)+10}" y="${Y(p.act)+3}" font-size="9.5" fill="var(--ink2)">${esc(p.id)} ${fmt(p.g,2)}x</text>`;});
  g+=`<text x="${P.l+iw/2}" y="${H-4}" font-size="10.5" fill="var(--ink3)" text-anchor="middle">預計專案周期（工作日）→</text>
      <text x="12" y="${P.t+ih/2}" font-size="10.5" fill="var(--ink3)" transform="rotate(-90 12 ${P.t+ih/2})" text-anchor="middle">實際專案周期（工作日）</text>`;
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">${g}</svg>`;
  el.querySelectorAll('.gp').forEach(n=>{
    const p=pts.find(x=>x.id===n.dataset.id);
    n.addEventListener('mouseenter',e=>tipOn(e,`<b>${esc(p.id)} ${esc(p.name)}</b>
      <div class="r"><span>類別 / 單位</span><b style="color:var(--ink)">${esc(p.cat)} · ${esc(p.div)}</b></div>
      <div class="r"><span>預計 → 實際</span><b style="color:var(--ink)">${fmt(p.plan)} → ${fmt(p.act)} 工作日</b></div>
      <div class="r"><span>工期膨脹</span><b style="color:${growthColor(p.g)}">${fmt(p.g,2)}x（${p.over>0?'+':''}${fmt(p.over)} 工作日）</b></div>
      <div class="r"><span>累計費用</span><b style="color:var(--ink)">${money(p.cost)}</b></div>`));
    n.addEventListener('mouseleave',tipOff);
    n.addEventListener('click',()=>{tipOff();onClick(p.id)});
  });
}
function growthLegend(){return `<div class="legend" style="margin-top:8px">
  <span><i style="background:var(--good)"></i>如期 ≤1.1x</span><span><i style="background:var(--warn)"></i>輕度 1.1–1.5x</span>
  <span><i style="background:var(--serious)"></i>嚴重 1.5–2.5x</span><span><i style="background:var(--crit)"></i>失控 &gt;2.5x</span>
  <span style="color:var(--ink3)">對角線上方＝實際超出計畫</span></div>`;}

/* ---------- 分組柱：預計 vs 實際 工作日 ---------- */
function groupedBars(el,rows,{lab,a,b,an='預計',bn='實際',ca='--s3',cb='--c1',fmtv=v=>fmt(v)}){
  const mx=Math.max(...rows.map(r=>Math.max(a(r),b(r))),1);
  el.innerHTML=rows.map(r=>`<div style="margin-bottom:11px">
    <div style="display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink2);margin-bottom:4px">
      <span>${esc(lab(r))}</span><span class="mono" style="color:${b(r)>a(r)?'var(--crit)':'var(--good)'}">${fmtv(a(r))} → ${fmtv(b(r))}　${a(r)?fmt(b(r)/a(r),2)+'x':''}</span></div>
    <div style="height:8px;background:var(--s2);border-radius:4px;overflow:hidden;margin-bottom:2px"><div style="width:${a(r)/mx*100}%;height:100%;background:${cv(ca)};border-radius:4px"></div></div>
    <div style="height:8px;background:var(--s2);border-radius:4px;overflow:hidden"><div style="width:${b(r)/mx*100}%;height:100%;background:${b(r)>a(r)?'var(--crit)':cv(cb)};border-radius:4px"></div></div>

/* ---------- 雙向柱：開工偏差 ---------- */
function divergingBar(el,rows,{lab,val,onClick,unit=' 天'}){
  const mx=Math.max(...rows.map(r=>Math.abs(val(r))),1);
  el.innerHTML=rows.map(r=>{const v=val(r),w=Math.abs(v)/mx*50;
    return `<div class="hbar" ${onClick?`data-id="${r.id}" style="cursor:pointer"`:''}>
      <div class="n" style="width:96px">${esc(lab(r))}</div>
      <div class="tr" style="background:var(--s2)">
        <span style="position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--ink3)"></span>
        <i style="left:${v<0?50-w:50}%;width:${w}%;background:${v<0?cv('--c1'):'var(--crit)'}"></i></div>
      <div class="v" style="width:58px;color:${v<0?cv('--c1'):'var(--crit)'}">${v>0?'+':''}${fmt(v)}${unit}</div></div>`}).join('');
  if(onClick) el.querySelectorAll('[data-id]').forEach(n=>n.addEventListener('click',()=>onClick(n.dataset.id)));
}

/* ---------- 類別 × 狀態 堆疊柱 ---------- */
function catStatus(el,rows,statuses){
  const W=560,H=250,P={l:40,r:12,t:12,b:42};
  const iw=W-P.l-P.r, ih=H-P.t-P.b;
  const mx=Math.max(...rows.map(r=>r.total),1), top=Math.ceil(mx/5)*5||5;
  const SC=[cv('--c1'),cv('--c2'),cv('--c3')];
  const bw=Math.min(40,iw/rows.length*0.55);
  let g='';
  for(let t=0;t<=5;t++){const v=top*t/5,yy=P.t+ih-v/top*ih;
    g+=`<line x1="${P.l}" y1="${yy}" x2="${P.l+iw}" y2="${yy}" stroke="var(--grid)"/>
        <text x="${P.l-7}" y="${yy+4}" font-size="10" fill="var(--ink3)" text-anchor="end">${fmt(v)}</text>`;}
  rows.forEach((r,i)=>{
    const cx=P.l+(i+0.5)/rows.length*iw; let acc=0;
    statuses.forEach((st,si)=>{
      const n=r[st]||0; if(!n)return;
      const hh=n/top*ih, yy=P.t+ih-acc-hh;
      g+=`<rect x="${cx-bw/2}" y="${yy+1}" width="${bw}" height="${Math.max(0,hh-2)}" fill="${SC[si]}" rx="2"/>`;
      if(hh>15)g+=`<text x="${cx}" y="${yy+hh/2+4}" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">${n}</text>`;
      acc+=hh;});
    g+=`<text x="${cx}" y="${H-24}" font-size="10.5" fill="var(--ink2)" text-anchor="middle">${esc(r.cat)}</text>`;
    g+=`<text x="${cx}" y="${H-10}" font-size="9.5" fill="${r.avg_growth==null?'var(--ink3)':growthColor(r.avg_growth)}" text-anchor="middle">${r.avg_growth==null?'—':fmt(r.avg_growth,2)+'x'}</text>`;
  });
  g+=`<text x="${P.l}" y="${H-10}" font-size="9" fill="var(--ink3)">膨脹→</text>`;
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">${g}</svg>
    <div class="legend">${statuses.map((st,i)=>`<span><i style="background:${SC[i]}"></i>${esc(st)}</span>`).join('')}
    <span style="color:var(--ink3)">下方數字＝該類別已結案專案之平均工期膨脹倍數</span></div>`;
}

/* ==================== 四維專用圖形 ==================== */
const execColor=v=>v==null?'var(--ink3)':v<=100?'var(--good)':v<=120?'var(--warn)':v<=200?'var(--serious)':'var(--crit)';

/* 通用「預計 vs 實際」散佈圖 */
function paScatter(el,pts,{xl,yl,unit='',onClick,fmtv=v=>fmt(v),colorOf,h=340,ref=[1.5,2]}={}){
  if(!pts.length){el.innerHTML='<div class="empty">無可比較之資料</div>';return;}
  const W=760,H=h,P={l:58,r:16,t:14,b:42};
  const mx=Math.max(...pts.map(p=>Math.max(p.x,p.y)),1);
  const mag=Math.pow(10,Math.floor(Math.log10(mx)));
  const top=Math.ceil(mx/mag)*mag;
  const iw=W-P.l-P.r, ih=H-P.t-P.b;
  const X=v=>P.l+v/top*iw, Y=v=>P.t+ih-v/top*ih;
  let g='';
  for(let t=0;t<=5;t++){const v=top*t/5;
    g+=`<line x1="${P.l}" y1="${Y(v)}" x2="${P.l+iw}" y2="${Y(v)}" stroke="var(--grid)"/>
        <text x="${P.l-8}" y="${Y(v)+4}" font-size="10" fill="var(--ink3)" text-anchor="end">${fmtv(v)}</text>
        <text x="${X(v)}" y="${H-24}" font-size="10" fill="var(--ink3)" text-anchor="middle">${fmtv(v)}</text>`;}
  g+=`<line x1="${X(0)}" y1="${Y(0)}" x2="${X(top)}" y2="${Y(top)}" stroke="var(--ink3)" stroke-width="1.5"/>
      <text x="${X(top)-6}" y="${Y(top)+14}" font-size="9.5" fill="var(--ink3)" text-anchor="end">1:1 如期／如預算</text>`;
  ref.forEach(k=>{const xe=top/k;
    g+=`<line x1="${X(0)}" y1="${Y(0)}" x2="${X(xe)}" y2="${Y(top)}" stroke="var(--grid)" stroke-dasharray="4 3"/>
        <text x="${X(xe)+4}" y="${Y(top)+10}" font-size="9" fill="var(--ink3)">${k}x</text>`;});
  pts.forEach(p=>{g+=`<circle class="pa" data-id="${p.id}" cx="${X(p.x)}" cy="${Y(Math.min(p.y,top))}" r="6.5"
    fill="${colorOf?colorOf(p):cv('--c1')}" stroke="var(--s1)" stroke-width="2" style="cursor:${onClick?'pointer':'default'}"/>`;});
  [...pts].sort((a,b)=>(b.y/(b.x||1))-(a.y/(a.x||1))).slice(0,3).forEach(p=>{
    g+=`<text x="${X(p.x)+10}" y="${Y(Math.min(p.y,top))+3}" font-size="9.5" fill="var(--ink2)">${esc(p.id)}</text>`;});
  g+=`<text x="${P.l+iw/2}" y="${H-5}" font-size="10.5" fill="var(--ink3)" text-anchor="middle">${esc(xl)} →</text>
      <text x="13" y="${P.t+ih/2}" font-size="10.5" fill="var(--ink3)" transform="rotate(-90 13 ${P.t+ih/2})" text-anchor="middle">${esc(yl)}</text>`;
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">${g}</svg>`;
  el.querySelectorAll('.pa').forEach(n=>{
    const p=pts.find(z=>z.id===n.dataset.id);
    n.addEventListener('mouseenter',e=>tipOn(e,`<b>${esc(p.id)} ${esc(p.name||'')}</b>
      ${p.sub?`<div class="r"><span>單位 / 負責人</span><b style="color:var(--ink)">${esc(p.sub)}</b></div>`:''}
      <div class="r"><span>${esc(xl)}</span><b style="color:var(--ink)">${fmtv(p.x)}${unit}</b></div>
      <div class="r"><span>${esc(yl)}</span><b style="color:var(--ink)">${fmtv(p.y)}${unit}</b></div>
      <div class="r"><span>比率</span><b style="color:${colorOf?colorOf(p):'var(--ink)'}">${p.x?fmt(p.y/p.x*100,0)+'%':'—'}</b></div>`));
    n.addEventListener('mouseleave',tipOff);
    if(onClick) n.addEventListener('click',()=>{tipOff();onClick(p.id)});
  });
}

/* 熱圖：專案 × 處 人力投入（工時） */
function heatmap(el,rowKeys,colItems,getVal,{onClick,rowLab=r=>r,unit=' hr',h=15}={}){
  if(!colItems.length){el.innerHTML='<div class="empty">無資料</div>';return;}
  const vals=[];rowKeys.forEach(r=>colItems.forEach(c=>{const v=getVal(r,c);if(v)vals.push(v)}));
  const mx=Math.max(...vals,1);
  const STEPS=['#cde2fb','#9ec5f4','#6da7ec','#3987e5','#256abf','#184f95'];
  const stepOf=v=>{if(!v)return null;const q=v/mx;return STEPS[Math.min(5,Math.floor(q*5.999))];};
  const LW=118;
  el.innerHTML=`<div style="overflow-x:auto">
    <div style="display:grid;grid-template-columns:${LW}px repeat(${colItems.length},minmax(22px,1fr));gap:2px;min-width:${LW+colItems.length*24}px">
      <div></div>${colItems.map(c=>`<div style="font-size:8.5px;color:var(--ink3);writing-mode:vertical-rl;text-orientation:mixed;height:76px;overflow:hidden;white-space:nowrap">${esc(c.id)}</div>`).join('')}
      ${rowKeys.map(r=>`<div style="font-size:11px;color:var(--ink2);display:flex;align-items:center;padding-right:6px;white-space:nowrap;overflow:hidden">${esc(rowLab(r))}</div>`+
        colItems.map(c=>{const v=getVal(r,c);const bg=stepOf(v);
          return `<div class="hcell" data-r="${esc(String(r))}" data-c="${c.id}" style="height:${h+9}px;border-radius:3px;
            background:${bg||'var(--s2)'};cursor:${onClick?'pointer':'default'}"></div>`}).join('')).join('')}
    </div></div>
    <div class="legend" style="margin-top:10px"><span style="color:var(--ink3)">投入工時：少</span>
    ${STEPS.map(c=>`<i style="background:${c};width:16px;height:10px;border-radius:2px"></i>`).join('')}
    <span style="color:var(--ink3)">多（最大 ${fmt(mx)}${unit}）</span><span style="color:var(--ink3)">　空白＝未投入</span></div>`;
  el.querySelectorAll('.hcell').forEach(n=>{
    const r=n.dataset.r, cid=n.dataset.c, c=colItems.find(z=>z.id===cid), v=getVal(r,c);
    n.addEventListener('mouseenter',e=>tipOn(e,`<b>${esc(cid)} ${esc(c.name||'')}</b>
      <div class="r"><span>單位</span><b style="color:var(--ink)">${esc(r)}</b></div>
      <div class="r"><span>投入工時</span><b style="color:var(--ink)">${v?fmt(v)+unit:'未投入'}</b></div>`));
    n.addEventListener('mouseleave',tipOff);
    if(onClick&&v) n.addEventListener('click',()=>{tipOff();onClick(cid)});
  });
}

/* ==================== 圓餅／甜甜圈 ==================== */
function donut(el,items,{h=300,center='',centerSub='',onClick=null,fmtv=v=>fmt(v),unit=''}={}){
  const tot=items.reduce((s,x)=>s+x.v,0)||1;
  const W=340,H=h,R=Math.min(W,H)/2-6,r=R*0.60,CX=W/2,CY=H/2;
  const arc=(a0,a1,ro,ri)=>{
    const p=(a,rr)=>[CX+rr*Math.cos(a),CY+rr*Math.sin(a)];
    const big=(a1-a0)>Math.PI?1:0;
    const [x0,y0]=p(a0,ro),[x1,y1]=p(a1,ro),[x2,y2]=p(a1,ri),[x3,y3]=p(a0,ri);
    return `M${x0},${y0} A${ro},${ro} 0 ${big} 1 ${x1},${y1} L${x2},${y2} A${ri},${ri} 0 ${big} 0 ${x3},${y3} Z`;
  };
  let a=-Math.PI/2,g='';
  const segs=[];
  items.forEach((x,i)=>{
    const sweep=x.v/tot*Math.PI*2, a1=a+Math.max(sweep,0.0001);
    segs.push({...x,a0:a,a1,pctv:x.v/tot*100});
    g+=`<path class="dseg" data-i="${i}" d="${arc(a,a1,R,r)}" fill="${x.c}"
      stroke="var(--s1)" stroke-width="2" style="cursor:${onClick?'pointer':'default'}"/>`;
    a=a1;
  });
  segs.forEach(s=>{ if(s.pctv<7)return;
    const am=(s.a0+s.a1)/2, rr=(R+r)/2;
    const lum=/^#(fab|eda|c98|cde|9ec|86b)/i.test(s.c)?1:0;
    g+=`<text x="${CX+rr*Math.cos(am)}" y="${CY+rr*Math.sin(am)+4}" text-anchor="middle"
      font-size="11.5" font-weight="700" fill="${lum?'#1a1a19':'#fff'}">${fmt(s.pctv,0)}%</text>`;});
  if(center) g+=`<text x="${CX}" y="${CY-2}" text-anchor="middle" font-size="26" font-weight="650" fill="var(--ink)">${esc(center)}</text>`;
  if(centerSub) g+=`<text x="${CX}" y="${CY+17}" text-anchor="middle" font-size="11" fill="var(--ink3)">${esc(centerSub)}</text>`;
  el.innerHTML=`<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
    <svg viewBox="0 0 ${W} ${H}" style="width:min(100%,340px);height:auto;display:block;flex:0 0 auto">${g}</svg>
    <table style="flex:1 1 200px;font-size:12px;min-width:190px"><tbody>
      ${segs.map((s,i)=>`<tr class="dleg" data-i="${i}" style="cursor:${onClick?'pointer':'default'}">
        <td style="padding:4px 6px;width:14px"><i style="display:inline-block;width:11px;height:11px;border-radius:3px;background:${s.c}"></i></td>
        <td style="padding:4px 6px;color:var(--ink2)">${esc(s.n)}${s.drill?' <span style="color:var(--c1);font-size:10.5px">▸展開</span>':''}</td>
        <td class="num" style="padding:4px 6px;font-weight:650">${fmtv(s.v)}${unit}</td>
        <td class="num" style="padding:4px 6px;color:var(--ink3)">${fmt(s.pctv,1)}%</td></tr>`).join('')}
    </tbody></table></div>`;
  const hit=(i,e)=>{const s=segs[i];
    tipOn(e,`<b>${esc(s.n)}</b><div class="r"><span>數值</span><b style="color:var(--ink)">${fmtv(s.v)}${unit}</b></div>
      <div class="r"><span>佔比</span><b style="color:var(--ink)">${fmt(s.pctv,1)}%</b></div>
      ${s.note?`<div class="r" style="color:var(--ink3)">${esc(s.note)}</div>`:''}
      ${s.drill?'<div class="r" style="color:var(--c1)">點擊展開明細</div>':''}`);};
  el.querySelectorAll('.dseg,.dleg').forEach(n=>{
    const i=+n.dataset.i;
    n.addEventListener('mouseenter',e=>hit(i,e));
    n.addEventListener('mouseleave',tipOff);
    if(onClick) n.addEventListener('click',()=>{tipOff();onClick(segs[i],i)});
  });
}

/* 分組直條柱：兩組（處）× 兩系列（預算/實際） */
function pairCols(el,groups,{h=300,fmtv=v=>money(v),an='預算',bn='實際',onClick}={}){
  const W=560,H=h,P={l:64,r:14,t:16,b:52};
  const iw=W-P.l-P.r, ih=H-P.t-P.b;
  const mx=Math.max(...groups.flatMap(g=>[g.a,g.b]),1);
  const mag=Math.pow(10,Math.floor(Math.log10(mx))), top=Math.ceil(mx/mag)*mag;
  const Y=v=>P.t+ih-v/top*ih;
  const gw=iw/groups.length, bw=Math.min(46,gw*0.3);
  let g='';
  for(let t=0;t<=4;t++){const v=top*t/4;
    g+=`<line x1="${P.l}" y1="${Y(v)}" x2="${P.l+iw}" y2="${Y(v)}" stroke="var(--grid)"/>
        <text x="${P.l-8}" y="${Y(v)+4}" font-size="10" fill="var(--ink3)" text-anchor="end">${fmtv(v)}</text>`;}
  groups.forEach((gp,i)=>{
    const cx=P.l+(i+0.5)*gw;
    const rate=gp.a?gp.b/gp.a*100:null;
    [['a',an,cv('--ink3'),-bw*0.55],['b',bn,rate&&rate>100?'var(--crit)':cv('--c1'),bw*0.55]].forEach(([k,lb,col,dx])=>{
      const v=gp[k], hh=v/top*ih;
      g+=`<rect class="pc" data-i="${i}" data-k="${k}" x="${cx+dx-bw/2}" y="${Y(v)}" width="${bw}" height="${Math.max(1,hh)}"
        fill="${col}" rx="3" style="cursor:${onClick?'pointer':'default'}"/>`;
      if(hh>26) g+=`<text x="${cx+dx}" y="${Y(v)-6}" text-anchor="middle" font-size="10.5" font-weight="700" fill="var(--ink2)">${fmtv(v)}</text>`;
    });
    g+=`<text x="${cx}" y="${H-30}" text-anchor="middle" font-size="12.5" font-weight="600" fill="var(--ink)">${esc(gp.n)}</text>`;
    g+=`<text x="${cx}" y="${H-15}" text-anchor="middle" font-size="10.5" fill="${rate==null?'var(--ink3)':execColor(rate)}">${gp.sub||''}${rate==null?'':'　執行率 '+fmt(rate,0)+'%'}</text>`;
  });
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">${g}</svg>
    <div class="legend"><span><i style="background:${cv('--ink3')}"></i>${esc(an)}</span>
    <span><i style="background:${cv('--c1')}"></i>${esc(bn)}（超出預算時轉紅）</span></div>`;
  el.querySelectorAll('.pc').forEach(n=>{
    const gp=groups[+n.dataset.i], k=n.dataset.k;
    n.addEventListener('mouseenter',e=>tipOn(e,`<b>${esc(gp.n)}　${k==='a'?esc(an):esc(bn)}</b>
      <div class="r"><span>${esc(an)}</span><b style="color:var(--ink)">${fmtv(gp.a)}</b></div>
      <div class="r"><span>${esc(bn)}</span><b style="color:var(--ink)">${fmtv(gp.b)}</b></div>
      <div class="r"><span>差異</span><b style="color:${gp.b>gp.a?'var(--crit)':'var(--good)'}">${gp.b>gp.a?'+':''}${fmtv(gp.b-gp.a)}</b></div>
      ${gp.sub?`<div class="r" style="color:var(--ink3)">${esc(gp.sub)}</div>`:''}`));
    n.addEventListener('mouseleave',tipOff);
    if(onClick) n.addEventListener('click',()=>{tipOff();onClick(gp)});
  });
}

<script>
/* ============================ LEVEL 1 ============================ */
/* ==================== 共用：層級用途說明條 ==================== */
function purpose(t,d){return `<div class="purpose"><b>${esc(t)}</b><span>${d}</span></div>`;}

/* ==================== LEVEL 1：5 圖表 ==================== */
let HRMODE='top';   // top=專案vs非專案 ; non=非專案展開
function renderL1(){

        兩處合計 ${money(budTot)} → <b style="color:${execColor(costTot/budTot*100)}">${money(costTot)}（${fmt(costTot/budTot*100,0)}%）</b></div>
      <div id="c_money"></div>

    <!-- 中：專案狀態 -->

    </div>

    <!-- 右：工時狀態 -->

      <div class="sec-h" style="margin-bottom:4px"><h3>③ 工時狀態</h3><div class="spacer"></div>

          <button class="tier hrseg" data-m="top" aria-selected="${HRMODE==='top'}" style="padding:5px 11px">專案 / 非專案</button>

        <div class="note">來源＝專案進度表逐人設計工時，為<b>各專案開案起至今的累計快照</b>（非上方 PLM002 的期間工時）。依人員所屬處別歸戶，含跨處支援。</div>
        <div id="c_hr_d" style="margin-top:8px"></div></div>

  </div>

  <div class="sec grid" style="grid-template-columns:.66fr 1.34fr">
    <!-- 風險矩陣 -->
    <div class="card" style="align-self:start"><h3>④ 風險矩陣（機率 × 衝擊）</h3>
      <div class="note">僅在製 ${act.length} 件。縱軸＝逾期發生機率（逾期天數＋SPI），橫軸＝衝擊程度（專案等級＋累計費用＋投入人力）。
        右上角為需優先處理區。點擊方格內代號展開專案。</div>
      <div class="rm" id="c_rm"></div>

      <div class="rmleg"><span><span class="dot bg-crit"></span>極高 ≥20</span><span><span class="dot bg-serious"></span>高 12–19</span>
        <span><span class="dot bg-warn"></span>中 6–11</span><span><span class="dot bg-good"></span>低 &lt;6</span></div>
      <div class="note" style="margin-top:10px;color:var(--ink2)" id="c_rmx"></div></div>

    <!-- 異常專案 -->
    <div class="card pad0">
      <div style="padding:16px 18px 0">
        <div class="sec-h" style="margin-bottom:6px"><h3>⑤ 異常專案</h3><div class="spacer"></div>
          <span id="c_abn_n" style="font-size:12px;color:var(--ink3)"></span></div>
        <div class="note">符合下列任一者列為異常：已逾預計完成日、進度 ≥99% 但未結案、PLM 標記「即將異常」、SPI &lt;0.6、有預計工時但實際未登錄、預算執行率 &gt;150%、結案延宕 &gt;60 天、結案日早於任務完成日。點擊列展開專案。</div>
        <div style="display:flex;gap:5px;flex-wrap:wrap;margin:10px 0 4px" id="c_abn_f"></div>
      </div>
      <div id="c_abn" style="max-height:900px;overflow-y:auto"></div></div>
  </div>`;

  /* ① 金額 */
  pairCols($('#c_money'),rd.map(m=>({n:m.div,a:m.bud,b:m.cost,sub:`${m.n} 案（${m.n_bud} 件有預算）`})),
    {onClick:g=>go(2,g.n)});
  {
    const rows=rd.flatMap(m=>m.depts.map(x=>({...x,div:m.div})));
    const mx=Math.max(...rows.map(r=>Math.max(r.bud,r.cost)),1);
    $('#c_money_d').innerHTML=rows.map(r=>{const rate=r.bud?r.cost/r.bud*100:null;
      return `<div class="hbar" data-dept="${esc(r.dept)}" data-div="${esc(r.div)}" style="cursor:pointer;margin-bottom:9px">
        <div class="n" style="width:96px">${esc(r.dept)} <span style="color:var(--ink3);font-size:10px">${r.n}案</span></div>
        <div style="flex:1">
          <div style="height:7px;background:var(--s2);border-radius:4px;overflow:hidden;margin-bottom:2px"><div style="width:${r.bud/mx*100}%;height:100%;background:${cv('--ink3')};border-radius:4px"></div></div>
          <div style="height:7px;background:var(--s2);border-radius:4px;overflow:hidden"><div style="width:${clamp(r.cost/mx*100,0,100)}%;height:100%;background:${rate&&rate>100?'var(--crit)':cv('--c1')};border-radius:4px"></div></div></div>
        <div class="v" style="width:96px;text-align:right"><span style="color:var(--ink3)">${money(r.bud)}</span><br><span style="color:${execColor(rate)};font-weight:650">${money(r.cost)}</span></div></div>`}).join('')
      +(oth.length?`<div class="note" style="margin-top:8px;color:var(--ink3)">另 ${oth.map(m=>`${esc(m.div)} ${m.n} 案`).join('、')}未編列預算亦無費用歸屬。</div>`:'');
    $$('#c_money_d [data-dept]').forEach(n=>n.addEventListener('click',()=>go(3,n.dataset.div,n.dataset.dept)));
  }

  /* ② 專案狀態 */
  const SC={'Active':cv('--c1'),'Closed':cv('--c3'),'Cancelled':cv('--ink3')};
  donut($('#c_stat'),SP.map(x=>({n:x.n,v:x.v,c:SC[x.k],k:x.k,note:`累計費用 ${money(x.cost)}`})),
    {center:String(all.length),centerSub:'件專案',unit:' 件',onClick:s=>filterAbn(s.k==='Active'?'__act':'__all')});
  {
    const mx=Math.max(...SP.map(x=>x.cost),1);
    $('#c_stat_c').innerHTML=SP.map(x=>`<div class="hbar"><div class="n" style="width:96px">${esc(x.n)}</div>
      <div class="tr"><i style="width:${x.cost/mx*100}%;background:${SC[x.k]}"></i></div>
      <div class="v" style="width:56px">${money(x.cost)}</div></div>`).join('');

  /* ③ 工時狀態 */
  const drawHr=()=>{
    const bk=CH.buckets, proj=bk.find(b=>b.k==='proj'), non=bk.filter(b=>b.k!=='proj');
    const CB={support:cv('--c2'),rdmisc:cv('--c3'),meet:cv('--c4'),cross:cv('--c5'),trip:cv('--c6'),other:cv('--ink3')};
    if(HRMODE==='top'){
      $('#c_hr_note').innerHTML=`回報期間 <b>${DATA.meta.ts_from} ~ ${DATA.meta.ts_to}</b>（${DATA.meta.ts_months} 個月、${fmt(DATA.meta.n_ts)} 筆全期）。依 PLM002「工時類別」歸屬（僅「一般專案」100% 掛專案編號）。已排除休假 ${fmt(CH.leave)} hr，淨工時 ${fmt(CH.net)} hr。`;
      donut($('#c_hr'),[{n:'專案直接工時',v:proj.h,c:cv('--c1')},

    } else {

      donut($('#c_hr'),non.map(b=>({n:b.label,v:b.h,c:CB[b.k]||cv('--ink3')})),

  $$('.hrseg').forEach(b=>b.addEventListener('click',()=>{HRMODE=b.dataset.m;
    $$('.hrseg').forEach(o=>o.setAttribute('aria-selected',o===b));drawHr();}));
  {
    const DP=DATA.div_people.filter(r=>r.hr_plan||r.hr_act);
    const mx=Math.max(...DP.flatMap(r=>[r.hr_plan,r.hr_act]),1);
    $('#c_hr_d').innerHTML=DP.map(r=>{const rate=r.hr_plan?r.hr_act/r.hr_plan*100:null;

      +`<div class="legend"><span><i style="background:${cv('--ink3')}"></i>預計設計工時</span><span><i style="background:${cv('--c1')}"></i>實際（超出預計時轉紅）</span></div>`;

  /* ④ 風險矩陣 */

  /* ⑤ 異常專案 */
  const KINDS=[...new Set(AB.map(a=>a.kind_label))];
  $('#c_abn_f').innerHTML=`<button class="fbtn" data-f="__all" aria-selected="true">全部 ${AB.length}</button>`
    +KINDS.map(k=>`<button class="fbtn" data-f="${esc(k)}" aria-selected="false">${esc(k)} ${AB.filter(a=>a.kind_label===k).length}</button>`).join('');
  window.filterAbn=f=>{
    const list=f==='__all'?AB:f==='__act'?AB.filter(a=>a.status==='Active'):AB.filter(a=>a.kind_label===f);
    $$('#c_abn_f .fbtn').forEach(b=>b.setAttribute('aria-selected',b.dataset.f===f));
    $('#c_abn_n').textContent=`顯示 ${list.length} / ${AB.length} 件`;
    $('#c_abn').innerHTML=list.length?`<div class="tw" style="max-height:none"><table><thead><tr>
      <th>異常類型</th><th>專案</th><th>名稱</th><th>處 / 部門</th><th>負責人</th>
      <th class="num">進度</th><th class="num">逾期</th><th class="num">SPI</th><th class="num">執行率</th><th>風險</th><th>異常說明</th></tr></thead><tbody>
      ${list.map(a=>`<tr class="clk" data-pid="${a.id}">
        <td><span class="chip ${kc[a.kind_label]||''}">${esc(a.kind_label)}</span></td>
        <td class="mono">${esc(a.id)}</td>
        <td><span class="trunc" style="max-width:150px" title="${esc(a.name)}">${esc(a.name)}</span></td>
        <td style="white-space:nowrap;color:var(--ink2)">${esc(a.div)} / ${esc(a.dept)}</td>
        <td style="white-space:nowrap">${esc(a.owner)}</td>
        <td class="num">${fmt(a.prog,0)}%</td>
        <td class="num ${a.delay>90?'st-crit':a.delay>0?'st-warn':''}">${a.delay||'—'}</td>
        <td class="num" style="color:${spiColor(a.spi==null?0.5:a.spi)}">${a.spi==null?'—':fmt(a.spi,2)}</td>
        <td class="num" style="color:${execColor(a.exec)};font-weight:650">${a.exec==null?'—':fmt(a.exec,0)+'%'}</td>
        <td><span class="chip ${riskClass(a.risk)}">${esc(a.lvl)}</span></td>
        <td style="color:var(--ink2);font-size:11.5px">${a.reasons.map(esc).join('；')}</td></tr>`).join('')}
    </tbody></table></div>`:'<div class="empty">無符合條件之異常專案</div>';
    bindProjRows($('#c_abn'));
  };
  filterAbn('__all');
  $$('#c_abn_f .fbtn').forEach(b=>b.addEventListener('click',()=>filterAbn(b.dataset.f)));
  $$('#view .clkx').forEach(n=>n.addEventListener('click',()=>openProject(n.dataset.id)));
}

/* ==================== LEVEL 2：處級管理 ==================== */
function renderL2(){
  const d=DV[ST.div], K=d.kpi, H=d.hrs, DM=d.dim, B=B14();
  const list=projList(d.projects), act=list.filter(ACT);
  const depts=Object.values(d.depts);
  const people=[...new Set(depts.flatMap(x=>x.people))];
  const pl=people.map(n=>PE[n]).filter(Boolean);
  const ids=new Set(d.projects);
  const cl=B.close_lag.filter(z=>ids.has(z.id));
  const sv=B.start_var.filter(z=>ids.has(z.id)&&Math.abs(z.v)>=7);
  const budP=list.filter(p=>p.bud_total>0), hrP=list.filter(p=>p.hr_plan_all>0);
  const cz=Object.entries(list.reduce((a,p)=>{if(p.root_cause&&p.root_cause!=='—')a[p.root_cause]=(a[p.root_cause]||0)+1;return a},{}))
    .map(([cause,n])=>({cause,n})).sort((a,b)=>b.n-a.n);

  $('#view').innerHTML=`
  ${purpose('第二層 · 處級管理','把第一層的四維落到本處：哪些案要控管、資源怎麼調、瓶頸在哪。逐案與逐人明細請看第三層。')}

  <div class="sec">
    <div class="sec-h"><h2>${esc(d.name)}</h2>
      <span class="sub">處級主管：${esc(d.head)}　·　${Object.keys(d.depts).length} 部門 · ${K.n_people} 位在職人員 · ${DM.n} 件專案</span>
      <div class="spacer"></div>
      <select class="sel" id="selDiv">${DATA.div_order.map(v=>`<option ${v===ST.div?'selected':''}>${esc(v)}</option>`).join('')}</select></div>
    <div class="tiles">
      ${tile('時程｜在製 / 逾期',`${DM.n_act} / ${DM.n_delay}`,'件',`逾期率 ${pct(DM.delay_rate)}，平均 ${fmt(DM.avg_delay)} 天`,DM.delay_rate>50?'st-crit':'st-warn')}
      ${tile('時程｜工期膨脹',DM.avg_growth==null?'—':fmt(DM.avg_growth,2),DM.avg_growth==null?'':'x',`已結案 ${DM.n_closed_calc} 件`,DM.avg_growth>1.3?'st-crit':'st-warn')}
      ${tile('預算｜執行率',DM.exec==null?'—':pct(DM.exec),'',`${money(DM.bud)} → ${money(DM.cost)}`,DM.exec>120?'st-crit':DM.exec>110?'st-warn':'st-good')}
      ${tile('預算｜超支案',fmt(DM.n_over_bud),'件',`共 ${DM.n_bud} 件有預算`,DM.n_over_bud?'st-warn':'st-good')}

function refBlock(){return `
  <div class="sec grid" style="grid-template-columns:1fr 1fr">
    <div class="card pad0">
      <div style="padding:16px 18px 0"><h3>① 欄位級資料溯源</h3>
      <div class="note">平台上每個數字都可回查到下列檔案／工作表／欄位。</div></div>
      <div class="tw" style="max-height:none"><table><thead><tr><th>來源檔／工作表</th><th>關鍵欄位</th><th>用於</th></tr></thead><tbody>
      <tr><td rowspan="5"><b>專案進度表.xlsx</b><br><span style="color:var(--ink3)">工作表1，第 6–49 列</span></td><td class="mono">R 專案總進度</td><td>SPI、CPI、平均進度</td></tr>
      <tr><td class="mono">H/I、M/N 起訖日</td><td>時程消耗比、延遲天數</td></tr>
      <tr><td class="mono">S 專案是否異常</td><td>在製案延遲天數、風險機率 +2</td></tr>
      <tr><td class="mono">W/X 總工時 預計/實際</td><td>CPI、工時缺口</td></tr>
      <tr><td class="mono">Y 欄起 逐人 預計/實際</td><td>個人貢獻佔比、工時達成率</td></tr>
      <tr><td rowspan="3"><b>PLM001.xlsx</b><br><span style="color:var(--ink3)">2,449 筆任務</span></td><td class="mono">F 描述／延遲原因</td><td>延遲根因文字分類</td></tr>
      <tr><td class="mono">H 任務負責人</td><td>個人任務歸戶（非專案負責人）</td></tr>
      <tr><td class="mono">L/Q 預計/實際完成日</td><td>準時率、逾期天數</td></tr>
      <tr><td rowspan="4"><b>PLM002.xlsx</b><br><span style="color:var(--ink3)">23,441 筆工時回報</span></td><td class="mono">E 工時類別</td><td><b>專案／非專案歸屬</b>、有效工時比</td></tr>
      <tr><td class="mono">F 專案編號</td><td><b>追蹤範圍內／外判定</b></td></tr>
      <tr><td class="mono">I 工作日期</td><td>負荷率期間、在職判定、月度趨勢</td></tr>
      <tr><td class="mono">J 工作時數</td><td>負荷率、工時歸屬、月度趨勢</td></tr>
      <tr><td rowspan="2"><b>研發專案預算與實際統計.xlsx</b><br><span style="color:var(--ink3)">2026年-專案費用統計(範圍)</span></td><td class="mono">V 專案總累計費用</td><td>風險衝擊費用分級、各層彙總</td></tr>
      <tr><td class="mono">B 部門主管、K 2026年費用</td><td>部門主管、年度投入 KPI</td></tr>
      <tr><td><b>PLM014.xlsx</b></td><td class="mono">全表</td><td style="color:var(--ink3)">僅交叉核對，未餵入指標</td></tr>
      <tr><td><b>費用檔「薪資」「預算-基礎數值」</b></td><td class="mono">時薪、費率</td><td style="color:var(--ink3)">刻意未用於個人績效（避免高職等自動得高分）</td></tr>
      </tbody></table></div>
    </div>
    <div class="card">
      <h3>② 方法論依據與與標準的差異</h3>
      <div style="font-size:12.5px;color:var(--ink2);line-height:1.75;margin-top:10px">
        <p style="margin:0 0 12px"><b style="color:var(--ink)">SPI / CPI — 實獲值管理 EVM</b><br>
        出處：ANSI/PMI 19-006-2019《The Standard for Earned Value Management》第 4.4.1.4 節，標準公式 SPI＝EV÷PV、CPI＝EV÷AC。<br>
        <span class="st-warn">差異</span>：本平台改以<b>時間比例</b>（進度%÷時程消耗%）與<b>工時</b>（預計工時×進度%÷實際工時）為基礎，因 PLM 未逐月結算 EV／PV 金額。此屬 Walt Lipke (2003) 提出之
        <b>Earned Schedule</b> SPI(t)＝ES÷AT 同族的簡化實作。<br>
        <b>意涵</b>：平均 SPI 0.49 不可與外部 EVM 專案直接比較，但內部橫向（處與處、案與案）與縱向趨勢比較完全有效。</p>

        <p style="margin:0 0 12px"><b style="color:var(--ink)">風險矩陣 — 機率 × 衝擊</b><br>
        出處：IEC 31010:2019《Risk management — Risk assessment techniques》Annex B「Consequence/likelihood matrix」；上位標準 ISO 31000:2018。<br>
        <span class="st-warn">差異</span>：標準只規範矩陣<b>形式</b>，不規定門檻。本平台的延遲 180/90/30 天、SPI 0.4/0.6/0.8/0.95、費用 500/200/80/20 萬、人力 8/6/4/2 人，
        係<b>依本公司 44 件專案分佈校準的內部標準</b>，可由管理層調整。<br>
        <b>限制</b>：相乘法會把「低機率高衝擊」與「高機率低衝擊」壓進同一格，兩者對策其實不同 —— 故矩陣旁仍並陳延遲天數、SPI、費用原始值。</p>

        <p style="margin:0 0 12px"><b style="color:var(--ink)">專案 / 非專案 工時歸屬</b><br>
        依據為 PLM002 之實證分佈：<b>「一般專案」13,191 筆 100% 掛有專案編號</b>，其餘 14 個類別掛號率均低於 26%（多數低於 5%），
        故以「一般專案」為專案直接工時、其餘歸非專案，而非依語意主觀判斷。<br>
        <span class="st-warn">注意</span>：<b>此歸屬未納入個人績效計分</b>。自動化處等支援型單位的本職即為輔助生產與治具設備，若以專案投入率計分會系統性懲罰該類單位。
        本區塊僅作產能流向的管理判讀。</p>

        <p style="margin:0 0 12px"><b style="color:var(--ink)">綜合績效 — 百分位常模 + 強制分配</b><br>
        百分位常模化為人資評鑑標準作法（原始分佈嚴重偏斜時改用相對位置）；強制分配即 GE 推行之 vitality curve。<br>
        <span class="st-crit">爭議</span>：強制分配有實證爭議（Schleicher et al., 2016, <i>HRM Review</i>），長期可能抑制協作、且小團隊易誤判。Microsoft、GE、Adobe 均已放棄或大幅修改。<br>
        <b>本平台立場</b>：等第<b>僅作為面談與資源配置的起點，不建議直接連動薪酬或去留</b>。配套為九項百分位全攤開、部門內排名並陳、以及人力四象限把負荷與績效分開看
        —— 過勞低效者需要的是卸載與支援，不是一個 D 級。</p>

        <p style="margin:0 0 12px"><b style="color:var(--ink)">工時與負荷</b><br>
        月標準工時 176 hr 依《勞動基準法》第 30 條（每日 8 小時、每週 40 小時）推算；2026-08 因資料僅至 8/12，分母按 12/22 工作日折算，避免當月負荷率被系統性低估。</p>

        <p style="margin:0"><b style="color:var(--ink)">資料視覺化</b><br>
        類別色序固定不循環、單一數值軸（不用雙軸）、色盲可辨識性以程式驗證（6 色組於 protan／deutan／tritan 模擬下之 ΔE 分離度，淺色與深色各驗一次），
        狀態色與類別色分離且必附文字標籤，確保不以顏色單獨承載語意。</p>
      </div>
    </div>
  </div>`;}

function explainDelay(p){
  const o=[];
  if(p.delay_days>0) o.push(`本案已較預計完成日延遲 <b>${p.delay_days} 天</b>。`);
  if(p.spi!=null&&p.spi<0.8) o.push(`時程績效 SPI ${fmt(p.spi,2)}：時程已消耗 ${fmt(p.consumed,0)}%，但進度僅 ${fmt(p.progress,0)}%，<b>進度赤字 ${fmt(Math.max(0,(p.consumed||0)-p.progress),0)} 個百分點</b>。`);
  if(p.hr_act_all===0&&p.hr_plan_all>0) o.push(`預計設計工時 ${fmt(p.hr_plan_all)} hr，但<b>實際工時完全未登錄</b> — 屬工時回報管理缺口，無法據以評估投入。`);
  else if(p.cpi!=null&&p.cpi<0.7) o.push(`工時效率 CPI ${fmt(p.cpi,2)}：已投入 ${fmt(p.hr_act_all)} hr，換算應完成 ${fmt(p.hr_plan_all*p.progress/100)} hr 的價值，<b>超支 ${fmt(p.hr_gap)} hr</b>，反映返工或估算失準。`);
  else if(p.cpi!=null&&p.cpi>1.5) o.push(`工時效率 CPI ${fmt(p.cpi,2)}：實際投入明顯低於進度所需，可能為<b>資源被其他專案排擠</b>或進度回報偏樂觀。`);
  if(p.n_tasks_overdue>0) o.push(`尚有 <b>${p.n_tasks_overdue} 項任務逾期未結</b>（共 ${p.n_tasks} 項）。`);
  if(p.growth!=null&&p.growth>1.5) o.push(`工期膨脹 <b>${fmt(p.growth,2)}x</b>：預計 ${fmt(p.plan_wd)} 工作日、實際 ${fmt(p.act_wd)} 工作日，超出 ${fmt(p.wd_over)} 個工作日。`);
  if(p.close_lag!=null&&p.close_lag>30) o.push(`任務已於 ${esc(p.task_end)} 全部完成，但直到 ${esc(p.close_date)} 才結案，<b>結案作業空轉 ${fmt(p.close_lag)} 天</b> —— 屬行政流程問題，非技術問題。`);
  if(p.status==='Active'&&p.progress>=99&&p.delay_days>0) o.push(`<span class="st-crit">注意</span>：進度已達 ${fmt(p.progress,0)}% 但專案仍為 Active 且逾預計完成日 <b>${fmt(p.delay_days)} 天</b>，且進度表未標示異常 —— 屬<b>結案作業未執行</b>，會持續累計費用與工期。`);
  if(p.start_var!=null&&p.start_var<-90) o.push(`實際開工比計畫早 ${fmt(Math.abs(p.start_var))} 天，顯示<b>開案計畫是在工作已進行後才補建</b>，計畫基準線失去意義。`);
  if(p.n_members>=10) o.push(`跨 ${p.n_members} 人協作，介面協調成本高，建議收斂核心小組。`);
  if(!o.length) o.push('目前無明顯時程或工時異常。');
  return o.map(t=>`<div>• ${t}</div>`).join('');
}

          <td class="num">${fmt(t.comp,0)}%</td><td class="mono">${esc(t.plan_end||'—')}</td>
          <td class="num ${t.slip>180?'st-crit':'st-warn'}"><b>${fmt(t.slip)}</b></td>
          <td style="color:var(--ink2)"><span class="trunc" style="max-width:260px" title="${esc(t.note)}">${esc(t.note||'—')}</span></td>
        </tr>`).join('')}</tbody></table></div>`:`<div class="empty">無逾期未結任務 👍</div>`}
    </div>
  </div>`;
  if($('#pparts')) barChart($('#pparts'),parts,{val:r=>r[1],label:r=>r[0],max:100,lw:104,
    color:r=>r[1]>=70?'var(--good)':r[1]>=40?cv('--c1'):r[1]>=25?'var(--warn)':'var(--crit)',fmtv:v=>fmt(v,0)});
  const mn=p.recent||[];
  $('#pmon').innerHTML=mn.map(m=>`<div class="hbar"><div class="n" style="width:56px">${esc(m.m)}</div>
    <div class="tr"><i style="width:${clamp(m.h/200*100,0,100)}%;background:${m.h>=150?'var(--good)':m.h>=100?'var(--warn)':'var(--serious)'}"></i>
    <span style="position:absolute;left:${176/200*100}%;top:-2px;bottom:-2px;width:2px;background:var(--ink3);opacity:.7"></span></div>
    <div class="v">${fmt(m.h,0)}</div></div>`).join('');
  const ke=Object.entries(p.kinds||{}).sort((a,b)=>b[1]-a[1]).slice(0,6);
  barChart($('#pkind'),ke,{val:r=>r[1],label:r=>r[0],color:r=>kindColor(r[0]),fmtv:v=>fmt(v,0),unit:'h',lw:132});
  if($('#pbk')) stackBar($('#pbk'),DATA.bucket_order.filter(k=>k!=='leave'&&p.bk&&p.bk[k])
    .map(k=>({label:DATA.bucket_label[k],h:p.bk[k],c:k==='other'?cv('--ink3'):cv(BKC[k]||'--c1'),dark:k==='other'?1:BKDARK[k]})));
  if($('#pout')) outRows($('#pout'),(p.out_top||[]).map(y=>{
    const pid=y.p.split('｜')[0], m=Object.keys(P).find(z=>z.slice(0,7)===pid.slice(0,7));
    return {p:y.p,h:y.h,same_family:!!m,match:m};}),null);
  if($('#pcm')) $('#pcm').innerHTML=comment(p);
  $('#dcontent').querySelectorAll('[data-pid]').forEach(r=>r.addEventListener('click',e=>{e.stopPropagation();openProject(r.dataset.pid)}));
  DR.classList.add('on');SC.classList.add('on');DR.scrollTop=0;
}

function comment(p){
  const o=[],s=p.score_parts||{};
  const hi=Object.entries(s).filter(([,v])=>v>=70).map(([k])=>k);
  const lo=Object.entries(s).filter(([,v])=>v<=30).map(([k])=>k);
  o.push(`綜合績效 <b>${fmt(p.score,1)} 分（${esc(p.grade)} 級）</b>${p.rank?`，全公司在職研發人員排名 <b>${p.rank}/${p.rank_of}</b>`:''}${p.dept_rank?`，部門內第 ${p.dept_rank} 名`:''}。`);
  if(hi.length)o.push(`<span class="st-good">相對優勢</span>：${hi.join('、')}。`);
  if(lo.length)o.push(`<span class="st-crit">待改善</span>：${lo.join('、')}。`);
  if(p.load>110)o.push(`負荷 ${fmt(p.load,0)}% 已<b>超過負荷上限</b>，建議減少同時在製專案（目前 ${p.n_proj_active} 件）或補充人力。`);
  else if(p.load<60&&p.load>0)o.push(`負荷 ${fmt(p.load,0)}% 偏低，尚有 <b>約 ${fmt((95-p.load)/100*176*6,0)} hr</b> 可承接量能，建議加載或檢視工時回報完整性。`);
  else if(p.load>=85)o.push(`負荷 ${fmt(p.load,0)}% 位於健康飽和區間。`);
  if(p.n_task_overdue>15)o.push(`逾期未結任務達 <b>${p.n_task_overdue} 項</b>（最長 ${fmt(p.max_overdue)} 天），為主要扣分項，建議逐案訂定收斂日期。`);
  if(p.otd!=null&&p.otd<15&&p.n_task_done>=10)o.push(`任務準時率僅 ${fmt(p.otd,0)}%、平均逾期 ${fmt(p.avg_slip)} 天，需檢討<b>任務拆解顆粒度與預估基準</b>。`);
  if(p.util<50&&p.hours>500)o.push(`有效工時比 ${fmt(p.util,0)}%，會議與其他非專案工時佔比偏高，建議檢視會議負擔。`);
  if(p.hr_ach!=null&&p.hr_ach>150)o.push(`專案工時達成率 ${fmt(p.hr_ach,0)}%，實際投入遠超預估，反映<b>估算失準或範疇擴張</b>。`);
  if(p.emp_status!=='在職')o.push(`<span class="st-warn">注意</span>：最後工時回報為 ${esc(p.last_m||'—')}，已無近期回報紀錄，不納入強制分配排名。`);
  return o.map(t=>`<div>• ${t}</div>`).join('');
}
</script>
<script>
/* ============================ shell ============================ */
function crumb(){
  const c=[`<span class="cx" data-lv="1">全公司（第一層）</span>`];
  if(ST.lv>=2)c.push(`<b>›</b><span class="cx" data-lv="2">${esc(ST.div)}（第二層）</span>`);
  if(ST.lv>=3)c.push(`<b>›</b><span class="cx" data-lv="3">${esc(ST.dept)}（第三層）</span>`);
  c.push(`<b>›</b><span style="color:var(--ink3)">點擊任一專案／人員可持續下鑽至個人事項</span>`);
  $('#crumb').innerHTML=c.join(' ');
  $$('#crumb .cx').forEach(x=>x.addEventListener('click',()=>go(+x.dataset.lv,ST.div,ST.dept)));
}
function render(){
  $$('.tier').forEach(t=>t.setAttribute('aria-selected',+t.dataset.lv===ST.lv));
  crumb();
  if(ST.lv===1)renderL1(); else if(ST.lv===2)renderL2(); else renderL3();
  window.scrollTo({top:0});
}
$$('.tier').forEach(t=>t.addEventListener('click',()=>go(+t.dataset.lv,ST.div,ST.dept)));
let SHOW_GRADE=false;
document.body.classList.add('gradeoff');
$('#grd').addEventListener('click',()=>{
  SHOW_GRADE=!SHOW_GRADE;
  document.body.classList.toggle('gradeoff',!SHOW_GRADE);
  $('#grd').textContent='績效等第：'+(SHOW_GRADE?'顯示':'隱藏');
  $('#grd').style.borderColor=SHOW_GRADE?'var(--c1)':'';
  render();
});
$('#thm').addEventListener('click',()=>{
  const d=document.documentElement.getAttribute('data-theme')==='dark';
  document.documentElement.setAttribute('data-theme',d?'light':'dark');
  $('#thm').textContent=d?'☀ 深色':'☾ 淺色';
  render();
});
$('#asof').textContent='資料基準日 '+DATA.meta.today;
$('#foot').innerHTML=`<div><b>資料來源</b>：<b style="color:var(--ink)">專案主檔 PLM014.xlsx</b>、專案進度表.xlsx（逐人工時與異常標記）、PLM001.xlsx、PLM002.xlsx、(2026.7月份)研發專案預算與實際統計.xlsx
  （專案 ${DATA.meta.n_proj} 件、PLM 任務 ${fmt(DATA.meta.n_tasks)} 筆、工時回報 ${fmt(DATA.meta.n_ts)} 筆／${DATA.meta.ts_from}~${DATA.meta.ts_to}；已通過 587 項全鏈交叉驗證）</div>
  <div style="margin-top:5px"><b>指標定義</b>：SPI＝專案進度 ÷ 時程消耗比（以 PLM014 預計專案周期「工作日」為分母）；工期膨脹＝PLM014 實際專案周期 ÷ 預計專案周期；CPI＝(預計工時×進度) ÷ 實際工時；風險值＝發生機率 × 衝擊程度（各 1–5 級）；
  負荷率＝近 6 個月回報工時 ÷ 應出勤工時（月 176hr，2026-08 按 12/22 折算）；綜合績效＝九項指標之全公司百分位加權，等第採強制分配。</div>
  <div style="margin-top:5px"><b>方法論依據</b>：ANSI/PMI 19-006-2019《The Standard for Earned Value Management》(EVM SPI/CPI)　·　
  Lipke, W. (2003) Earned Schedule, SPI(t)＝ES÷AT　·　IEC 31010:2019《Risk management — Risk assessment techniques》Annex B 風險矩陣　·　
  ISO 31000:2018《Risk management — Guidelines》　·　Schleicher et al. (2016)《Precarious curve ahead》, HRM Review（強制分配之限制）　·　
  台灣《勞動基準法》第 30 條（標準工時）。詳見第一層「資料來源與方法論」及《研發戰情室_計算與評估方式說明.md》。</div>
  <div style="margin-top:5px;color:var(--ink3)"><b>分層定位</b>：第一層＝決策儀表板（5 圖：專案金額分兩處／專案狀態／工時狀態／風險矩陣／異常專案）／第二層＝處級管理（控管與資源調度）／第三層＝數據明細與說明（指標追溯、逐案明細、計算方法）。組織為兩處架構：研發一處（研一部、研二部、技術中心、研三部）、研發二處（生技、產品開發、自動化）。</div>
  <div style="margin-top:5px;color:var(--ink3)"><b>使用限制</b>：SPI／CPI 以時間與工時為基礎，非標準 EVM 之金額基礎，僅適用內部橫向與縱向比較；
  預算三段構成已扣除「依工時分攤」欄內含之研究發展費以免重複計算；工時一律以逐人明細加總為準；個人績效等第預設隱藏（頁首可切換），僅為面談與資源配置起點，不建議直接連動薪酬或去留。</div>`;
render();
</script>
